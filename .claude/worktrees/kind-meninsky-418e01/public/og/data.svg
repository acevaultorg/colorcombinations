<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7EF"/>

  <g transform="translate(80, 64)">
    <rect x="0" y="-14" width="14" height="14" fill="#9A2A2A"/>
    <rect x="16" y="-14" width="14" height="14" fill="#1B2A4E"/>
    <rect x="32" y="-14" width="14" height="14" fill="#F4EEE0" stroke="#d9d6ce" stroke-width="0.5"/>
    <text x="58" y="0" font-family="EB Garamond, Garamond, serif" font-size="18" fill="#141414">The Dictionary of Color Combinations</text>
  </g>

  <text x="80" y="135" font-family="Inter, sans-serif" font-size="14" fill="#9A2A2A" letter-spacing="0.14em">DATA + API</text>
  <text x="80" y="220" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">The full archive,</text>
  <text x="80" y="305" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">downloadable.</text>
  <text x="80" y="365" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">CSV bulk downloads + JSON API. CC-BY-4.0,</text>
  <text x="80" y="400" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">CORS-enabled, fetchable from any origin.</text>

  <line x1="80" y1="445" x2="1120" y2="445" stroke="#d9d6ce" stroke-width="1"/>

  <!-- Three dataset cards -->
  <g>
    <rect x="80" y="475" width="335" height="120" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="4"/>
    <text x="100" y="510" font-family="JetBrains Mono, Menlo, monospace" font-size="14" fill="#141414">palettes.csv</text>
    <text x="100" y="540" font-family="JetBrains Mono, Menlo, monospace" font-size="44" fill="#9A2A2A" font-weight="500">378</text>
    <text x="100" y="568" font-family="Inter, sans-serif" font-size="11" fill="#9a9a9a" letter-spacing="0.06em">ROWS · slug, hex, names, era</text>
  </g>

  <g>
    <rect x="432" y="475" width="335" height="120" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="4"/>
    <text x="452" y="510" font-family="JetBrains Mono, Menlo, monospace" font-size="14" fill="#141414">colors.csv</text>
    <text x="452" y="540" font-family="JetBrains Mono, Menlo, monospace" font-size="44" fill="#1B2A4E" font-weight="500">210</text>
    <text x="452" y="568" font-family="Inter, sans-serif" font-size="11" fill="#9a9a9a" letter-spacing="0.06em">ROWS · hex, RGB, hue, contrast</text>
  </g>

  <g>
    <rect x="784" y="475" width="336" height="120" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="4"/>
    <text x="804" y="510" font-family="JetBrains Mono, Menlo, monospace" font-size="14" fill="#141414">collections.csv</text>
    <text x="804" y="540" font-family="JetBrains Mono, Menlo, monospace" font-size="44" fill="#3A7D7B" font-weight="500">64</text>
    <text x="804" y="568" font-family="Inter, sans-serif" font-size="11" fill="#9a9a9a" letter-spacing="0.06em">ROWS · slug, title, count, accent</text>
  </g>

  <text x="1120" y="615" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="0.08em">colorcombinations.org/data</text>
</svg>
