<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7EF"/>

  <!-- Site mark -->
  <g transform="translate(80, 64)">
    <rect x="0" y="-14" width="14" height="14" fill="#9A2A2A"/>
    <rect x="16" y="-14" width="14" height="14" fill="#1B2A4E"/>
    <rect x="32" y="-14" width="14" height="14" fill="#F4EEE0" stroke="#d9d6ce" stroke-width="0.5"/>
    <text x="58" y="0" font-family="EB Garamond, Garamond, serif" font-size="18" fill="#141414">The Dictionary of Color Combinations</text>
  </g>

  <!-- Title block -->
  <text x="80" y="135" font-family="Inter, sans-serif" font-size="14" fill="#9A2A2A" letter-spacing="0.14em">FREE TOOLS</text>
  <text x="80" y="220" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">Three free</text>
  <text x="80" y="305" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">design tools.</text>
  <text x="80" y="365" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">No signups, no tracking, no ads.</text>

  <line x1="80" y1="425" x2="1120" y2="425" stroke="#d9d6ce" stroke-width="1"/>

  <!-- Three tool cards -->
  <g>
    <!-- Contrast Checker card -->
    <rect x="80" y="455" width="335" height="140" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="6"/>
    <rect x="100" y="475" width="60" height="100" fill="#1B2A4E"/>
    <rect x="160" y="475" width="60" height="100" fill="#F4EEE0"/>
    <text x="240" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9a9a9a" letter-spacing="0.1em">WCAG 2.1</text>
    <text x="240" y="528" font-family="EB Garamond, Garamond, serif" font-size="22" fill="#141414">Contrast Checker</text>
    <text x="240" y="552" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">Ratio + AA/AAA grade</text>
    <text x="240" y="572" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">for any two colors.</text>
  </g>

  <g>
    <!-- Palette Finder card -->
    <rect x="432" y="455" width="335" height="140" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="6"/>
    <rect x="452" y="475" width="40" height="100" fill="#9A2A2A"/>
    <rect x="492" y="475" width="40" height="100" fill="#D4A76A"/>
    <rect x="532" y="475" width="40" height="100" fill="#4E6C50"/>
    <text x="592" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9a9a9a" letter-spacing="0.1em">FROM ONE COLOR</text>
    <text x="592" y="528" font-family="EB Garamond, Garamond, serif" font-size="22" fill="#141414">Palette Finder</text>
    <text x="592" y="552" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">Search 378 historical</text>
    <text x="592" y="572" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">palettes by hex.</text>
  </g>

  <g>
    <!-- Data + API card -->
    <rect x="784" y="455" width="336" height="140" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="6"/>
    <rect x="804" y="475" width="35" height="100" fill="#141414"/>
    <rect x="839" y="475" width="35" height="100" fill="#FAF7EF" stroke="#d9d6ce" stroke-width="0.5"/>
    <rect x="874" y="475" width="35" height="100" fill="#9A2A2A"/>
    <text x="935" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9a9a9a" letter-spacing="0.1em">CSV + JSON</text>
    <text x="935" y="528" font-family="EB Garamond, Garamond, serif" font-size="22" fill="#141414">Data + API</text>
    <text x="935" y="552" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">Bulk downloads, full</text>
    <text x="935" y="572" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">archive, CC-BY-4.0.</text>
  </g>

  <text x="1120" y="615" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="0.08em">colorcombinations.org</text>
</svg>
