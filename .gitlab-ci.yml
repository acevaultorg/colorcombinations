# VALIDATE-ONLY since 2026-09-24: the CI deploy step was removed. rg-freeze-guard and its register exist
# only on the Macs, so a CI deploy shipped with no freeze check. Production deploys: `npm run deploy`
# (deploy.sh runs predeploy-git-guard, which runs rg-freeze-guard).
# Server-side build + deploy for colorcombinations.org -> Cloudflare Pages.
# Runs on GitLab's fast runners so deploys don't stall on the home uplink /
# wrangler's ~56 MB-per-connection reset. Uses `wrangler pages deploy` (NOT the
# chunked deployer) so the Pages Function in ./functions/ (api/subscribe.js —
# the "Get the next study" email capture; KV binding SUBSCRIBERS already set on
# the project) actually ships. Static Astro build, no DB/secret at build time.
# ONE secret CI/CD variable required: CLOUDFLARE_API_TOKEN (Cloudflare Pages:Edit).
#
# POST-DEPLOY ASSERTION (added 2026-09-03). `wrangler pages deploy` can exit 0
# having uploaded nothing; nothing here would have noticed. The assertion below
# polls the CF Pages API and fails unless a production deployment whose
# commit_hash equals $CI_COMMIT_SHA reached `success`.
#
# WHY THE commit_hash FORM IS VALID HERE (it is NOT valid everywhere — verify
# per repo before copying this): this job deploys with `wrangler ...
# --commit-dirty=true`, which attaches git metadata. Confirmed empirically
# 2026-09-03 — CI pipeline SHAs ee37f767, d105e072 and 79d225ab each appear as
# `commit_hash` on a CF production deployment. Sibling repos that deploy via
# scripts/cf-pages-chunked-deploy.py post only `manifest` + `branch`, so CF
# records commit_hash=None and this exact assertion would FALSE-RED on every
# run (readstacks asserts the deployment id instead, for that reason).
stages: [validate]

validate_build:
  stage: validate
  image: node:22
  timeout: 1h
  interruptible: true
  variables:
    CLOUDFLARE_ACCOUNT_ID: "72bfd26c5f3c935393a25e5c0dea6039"
    CF_PAGES_PROJECT: "colorcombinations"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  # ── IndexNow manifest persistence (2026-09-06) ────────────────────────────
  # `.indexnow-manifest.json` IS git-tracked (46b11cd), so a fresh CI checkout
  # always has A baseline — that is why wiring IndexNow into CI at all was safe.
  # But the manifest the job WRITES was thrown away with the container, so the
  # baseline never advanced: it stayed frozen at its commit date while content
  # shipped on top of it. Measured 2026-09-06, 35 src/ commits after the
  # baseline: 1,386 of 1,474 sitemap URLs no longer matched it, so the next
  # deploy would have announced ~94% of the sitemap — and then done it AGAIN on
  # every subsequent deploy, since nothing advanced the baseline. That repetition
  # is the batch-abuse pattern scripts/indexnow-ping.mjs exists to prevent,
  # arriving through the back door. It matters here specifically because this
  # site is Bing-native (519 Bing clicks vs 4 Google/30d) and ChatGPT grounds on
  # the Bing index — the one channel worth protecting.
  #
  # Cache, not a git write-back: the alternative needs a push credential this job
  # does not have (and minting one is an operator decision). GitLab restores the
  # cache AFTER checkout, so the advanced manifest correctly overwrites the git
  # baseline, and the job saves the refreshed one for the next run.
  #
  # STRICTLY CANNOT BE WORSE THAN TODAY: a cache miss (eviction, new branch,
  # runner change) simply leaves the git-tracked baseline in place — i.e. exactly
  # the current behaviour, submitting the genuinely-changed set. It degrades to
  # today's state, never to something new.
  cache:
    key: "indexnow-manifest-$CI_COMMIT_REF_SLUG"
    paths:
      - .indexnow-manifest.json
    policy: pull-push
  script:
    # DOCS-ONLY SHORT-CIRCUIT. A build here is ~8-10 min against a 400-minute
    # free monthly budget for the WHOLE acevault-lab namespace — roughly 40-50
    # deploys a month for every repo combined. On 2026-09-04 the namespace hit
    # ci_quota_exceeded and all fleet deploys stopped; two of the builds that
    # got it there were commits that touched only .claude/ and changed no
    # shipped byte.
    #
    # Nothing under .claude/ can affect the output: the only two references to
    # it in src/ are inside COMMENTS (monetization.ts, index.astro), and there
    # are no .md files under src/, so no content collection reads it.
    #
    # FAILS OPEN. If the diff cannot be computed — first push, all-zero
    # before-SHA, or a shallow clone that lacks the parent — we BUILD. Skipping
    # a build we should have run would silently diverge repo from live, which
    # is far worse than spending the minutes.
    - |
      SKIP=no
      # BASELINE = the commit CF Pages is actually serving, not CI_COMMIT_BEFORE_SHA.
      #
      # WHY (measured 2026-09-06, §E55): `interruptible: true` means a push made
      # seconds after a code push CANCELS the earlier pipeline. If that later push
      # is .claude/-only, its own diff is docs-only, it short-circuits, and the
      # canceled code change is NEVER BUILT — and never will be, because every
      # subsequent push is judged against ITS OWN parent, not against what is live.
      # That is exactly what happened to 5bab2ac (a sitemap-ai fix): pipeline
      # canceled 4s later by a state-only commit, then two more state-only commits
      # each correctly skipped, leaving production on 275ea2a with the fix stranded
      # in git. Every signal was green — two "success" jobs that ran for 22s and 31s.
      #
      # Diffing against the LIVE commit makes the skip self-healing: a dropped
      # deploy is picked up by the next push automatically, because the baseline
      # only advances when something actually ships.
      BASELINE=""
      if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
        BASELINE=$(curl -sS -m 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT/deployments?per_page=10&env=production" \
          | node -e '
            let b="";process.stdin.on("data",d=>b+=d).on("end",()=>{
              try{const j=JSON.parse(b);
                const d=(j.result||[]).find(x=>x.latest_stage&&x.latest_stage.status==="success"
                  &&x.deployment_trigger&&x.deployment_trigger.metadata&&x.deployment_trigger.metadata.commit_hash);
                process.stdout.write(d?d.deployment_trigger.metadata.commit_hash:"");
              }catch(e){process.stdout.write("");}});' 2>/dev/null || true)
      fi
      if [ -n "$BASELINE" ] && git cat-file -e "$BASELINE^{commit}" 2>/dev/null; then
        echo "docs-only check: baseline = live deployment $BASELINE"
      else
        # BASELINE unknown to this checkout (shallow clone, first deploy, API down).
        # Do NOT silently fall back to CI_COMMIT_BEFORE_SHA — that is the exact
        # blindness this replaces. Fetch it, and if it still is not there, BUILD.
        if [ -n "$BASELINE" ]; then git fetch --quiet origin "$BASELINE" --depth=1 2>/dev/null || true; fi
        if [ -n "$BASELINE" ] && git cat-file -e "$BASELINE^{commit}" 2>/dev/null; then
          echo "docs-only check: baseline = live deployment $BASELINE (fetched)"
        else
          echo "docs-only check: live baseline unavailable -> BUILDING (fail open)"
          BASELINE=""
        fi
      fi
      BEFORE="$BASELINE"
      if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
         && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
        CHANGED=$(git diff --name-only "$BEFORE" "$CI_COMMIT_SHA" 2>/dev/null || true)
        if [ -n "$CHANGED" ] && [ -z "$(printf '%s\n' "$CHANGED" | grep -v '^\.claude/' || true)" ]; then
          SKIP=yes
        fi
      fi
      if [ "$SKIP" = "yes" ]; then
        echo "=============================================================="
        echo "SKIPPED: every changed path is under .claude/ — nothing that"
        echo "reaches the built site. NO BUILD AND NO DEPLOY HAPPENED."
        echo "Production still serves the previous commit, which is correct."
        printf '%s\n' "$CHANGED" | sed 's/^/  /'
        echo "=============================================================="
        exit 0
      fi
      echo "docs-only check: building (changed paths include non-.claude files)"
    - node -v
    - npm ci --no-audit --no-fund
    - npx astro build
    - node scripts/verify-mediavine-exclusions.mjs
    # AFFILIATE LEAK GATE. This site routes every Amazon link through /go/
    # (Design-B gesture gate, affiliate-link-gate.md), so a raw tagged link in
    # static HTML is a leak. The CONTROL is the point: tagged=0 proves nothing
    # if the grep or the build is broken. `|| true` is required — grep exits 1
    # on zero matches, which under set -e kills the job.
    # Measured 2026-09-03 before adding: tagged=0, control=1693, 36846 /go/ links.
    - |
      LEAK=$( (grep -rlE 'tag=[a-z0-9]+-20' dist --include='*.html' || true) | wc -l | tr -d ' ')
      CONTROL=$( (grep -rl "colorcombinations" dist --include='*.html' || true) | wc -l | tr -d ' ')
      echo "leak gate: tagged=$LEAK (must be 0)  control=$CONTROL files mention the brand (must be >0)"
      if [ "$CONTROL" = "0" ]; then echo "ABORT: control found 0 files — the grep or the build is broken, so tagged=0 proves nothing"; exit 1; fi
      if [ "$LEAK" != "0" ]; then echo "ABORT: $LEAK page(s) leaked the affiliate tag into static HTML"; exit 1; fi
    # PAGE-COUNT FLOOR. `wrangler pages deploy` REPLACES the whole directory, so
    # a short build does not merely under-deliver — it DELETES live pages. This
    # is the fleet's dormbyschool case (repo built 177 pages while the site
    # served 1,250; deploying would have removed 86% of a live earning site).
    #
    # The guard script has this check, but only in --pre, which cannot run here
    # (it also asserts dist/_worker.js, which CI correctly does not build). So
    # the floor has to live in CI directly.
    #
    # No separate control is needed: a broken find or a missing dist yields 0,
    # and 0 < floor aborts. The blind case fails closed.
    - |
      PAGES=$(find dist -name '*.html' | wc -l | tr -d ' ')
      echo "page-count floor: $PAGES html files in dist (floor 1500; 2128 on 2026-09-03)"
      if [ "$PAGES" -lt 1500 ]; then
        echo "ABORT: only $PAGES pages built — deploying would DELETE live pages."
        echo "Fix the build. Do NOT lower this floor to make the pipeline green."
        exit 1
      fi
    - |
      echo "VALIDATE-ONLY: build, leak gate and page-count floor passed. Nothing was deployed."
      echo "CI does not deploy colorcombinations (2026-09-24): the RG freeze guard and its register live only on the Macs."
      echo "Deploy with: npm run deploy  (deploy.sh -> predeploy-git-guard -> rg-freeze-guard)"
