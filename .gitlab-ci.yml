# Server-side build + deploy for colorcombinations.org -> Cloudflare Pages.
# Runs on GitLab's fast runners so deploys don't stall on the home uplink /
# wrangler's ~56 MB-per-connection reset. Uses `wrangler pages deploy` (NOT the
# chunked deployer) so the Pages Function in ./functions/ (api/subscribe.js —
# the "Get the next study" email capture; KV binding SUBSCRIBERS already set on
# the project) actually ships. Static Astro build, no DB/secret at build time.
# ONE secret CI/CD variable required: CLOUDFLARE_API_TOKEN (Cloudflare Pages:Edit).
stages: [deploy]

deploy_cf_pages:
  stage: deploy
  image: node:22
  timeout: 1h
  interruptible: true
  variables:
    CLOUDFLARE_ACCOUNT_ID: "72bfd26c5f3c935393a25e5c0dea6039"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - node -v
    - npm ci --no-audit --no-fund
    - npx astro build
    - npx --yes wrangler@latest pages deploy dist --project-name=colorcombinations --branch main --commit-dirty=true
