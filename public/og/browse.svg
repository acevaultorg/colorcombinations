<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7EF"/>

  <g transform="translate(80, 64)">
    <rect x="0" y="-14" width="14" height="14" fill="#9A2A2A"/>
    <rect x="16" y="-14" width="14" height="14" fill="#1B2A4E"/>
    <rect x="32" y="-14" width="14" height="14" fill="#F4EEE0" stroke="#d9d6ce" stroke-width="0.5"/>
    <text x="58" y="0" font-family="EB Garamond, Garamond, serif" font-size="18" fill="#141414">The Dictionary of Color Combinations</text>
  </g>

  <text x="80" y="135" font-family="Inter, sans-serif" font-size="14" fill="#9A2A2A" letter-spacing="0.14em">BROWSE</text>
  <text x="80" y="220" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">All 378 palettes,</text>
  <text x="80" y="305" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">filterable.</text>
  <text x="80" y="365" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">Filter by hue, color count, era, mood — find</text>
  <text x="80" y="400" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">the exact combination for any project.</text>

  <line x1="80" y1="445" x2="1120" y2="445" stroke="#d9d6ce" stroke-width="1"/>

  <!-- 12-square palette grid showcase -->
  <g>
    <rect x="80" y="475" width="80" height="80" fill="#9A2A2A"/>
    <rect x="170" y="475" width="80" height="80" fill="#1B2A4E"/>
    <rect x="260" y="475" width="80" height="80" fill="#F3EBDA"/>
    <rect x="350" y="475" width="80" height="80" fill="#3A7D7B"/>
    <rect x="440" y="475" width="80" height="80" fill="#D4A017"/>
    <rect x="530" y="475" width="80" height="80" fill="#7A4E8F"/>
    <rect x="620" y="475" width="80" height="80" fill="#A3C293"/>
    <rect x="710" y="475" width="80" height="80" fill="#F9D5E0"/>
    <rect x="800" y="475" width="80" height="80" fill="#878A74"/>
    <rect x="890" y="475" width="80" height="80" fill="#DCCB7A"/>
    <rect x="980" y="475" width="80" height="80" fill="#5C3A2E"/>
    <rect x="1070" y="475" width="80" height="80" fill="#2F4A36"/>
  </g>

  <text x="1120" y="615" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="0.08em">colorcombinations.org/browse</text>
