    <text x="305" y="535" font-family="EB Garamond, Garamond, serif" font-size="20" fill="#141414">Books</text>
    <text x="305" y="558" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">Color theory + history</text>
    <text x="305" y="578" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">via Bookshop affiliate.</text>
  </g>

  <g>
