    <text x="542" y="540" text-anchor="middle" font-family="EB Garamond, Garamond, serif" font-size="34" fill="#FAF7EF" font-style="italic">Aa</text>
    <text x="650" y="510" font-family="Inter, sans-serif" font-size="9" fill="#9a9a9a" letter-spacing="0.1em">PRO DESIGN TOOLS</text>
    <text x="650" y="535" font-family="EB Garamond, Garamond, serif" font-size="20" fill="#141414">Toolbox</text>
    <text x="650" y="558" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">Framer, Figma, Coolors</text>
    <text x="650" y="578" font-family="EB Garamond, Garamond, serif" font-size="13" fill="#6b6b6b">design tools.</text>
  </g>

