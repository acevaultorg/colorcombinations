<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7EF"/>

  <g transform="translate(80, 64)">
    <rect x="0" y="-14" width="14" height="14" fill="#9A2A2A"/>
    <rect x="16" y="-14" width="14" height="14" fill="#1B2A4E"/>
    <rect x="32" y="-14" width="14" height="14" fill="#F4EEE0" stroke="#d9d6ce" stroke-width="0.5"/>
    <text x="58" y="0" font-family="EB Garamond, Garamond, serif" font-size="18" fill="#141414">The Dictionary of Color Combinations</text>
  </g>

  <text x="80" y="135" font-family="Inter, sans-serif" font-size="14" fill="#9A2A2A" letter-spacing="0.14em">SHOP</text>
  <text x="80" y="220" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">The library,</text>
  <text x="80" y="305" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">the toolbox,</text>
  <text x="80" y="385" font-family="EB Garamond, Garamond, serif" font-size="60" font-weight="500" font-style="italic" fill="#6b6b6b">and a thank-you.</text>

  <line x1="80" y1="445" x2="1120" y2="445" stroke="#d9d6ce" stroke-width="1"/>

  <!-- Three product mini-cards -->
  <g>
    <!-- Library (books) -->
    <rect x="80" y="475" width="335" height="120" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="4"/>
    <rect x="100" y="495" width="60" height="80" fill="#3C6E8F"/>
    <rect x="165" y="495" width="60" height="80" fill="#9A2A2A"/>
