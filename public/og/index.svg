<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7EF"/>

  <!-- Site mark -->
  <g transform="translate(80, 64)">
    <rect x="0" y="-14" width="14" height="14" fill="#9A2A2A"/>
    <rect x="16" y="-14" width="14" height="14" fill="#1B2A4E"/>
    <rect x="32" y="-14" width="14" height="14" fill="#F4EEE0" stroke="#d9d6ce" stroke-width="0.5"/>
    <text x="58" y="0" font-family="EB Garamond, Garamond, serif" font-size="18" fill="#141414">The Dictionary of Color Combinations</text>
  </g>

  <!-- Title block (left half) -->
  <text x="80" y="200" font-family="EB Garamond, Garamond, serif" font-size="64" font-weight="500" fill="#141414">The Dictionary of</text>
  <text x="80" y="270" font-family="EB Garamond, Garamond, serif" font-size="64" font-weight="500" fill="#141414">Color Combinations</text>
  <text x="80" y="330" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">All 348 historical Sanzo Wada plates,</text>
  <text x="80" y="365" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">free to browse, copy, embed, and export.</text>

  <!-- Stat row -->
  <line x1="80" y1="420" x2="1120" y2="420" stroke="#d9d6ce" stroke-width="1"/>
  <text x="80" y="465" font-family="Inter, sans-serif" font-size="13" fill="#9a9a9a" letter-spacing="0.08em">378 PALETTES</text>
  <text x="280" y="465" font-family="Inter, sans-serif" font-size="13" fill="#9a9a9a" letter-spacing="0.08em">210 NAMED COLORS</text>
  <text x="540" y="465" font-family="Inter, sans-serif" font-size="13" fill="#9a9a9a" letter-spacing="0.08em">64 COLLECTIONS</text>
  <text x="780" y="465" font-family="Inter, sans-serif" font-size="13" fill="#9a9a9a" letter-spacing="0.08em">CC-BY-4.0</text>

  <!-- Swatch row showcasing the brand colors -->
  <rect x="80" y="500" width="173" height="80" fill="#9A2A2A"/>
  <rect x="253" y="500" width="173" height="80" fill="#1B2A4E"/>
  <rect x="426" y="500" width="173" height="80" fill="#F3EBDA"/>
  <rect x="599" y="500" width="173" height="80" fill="#3A7D7B"/>
  <rect x="772" y="500" width="173" height="80" fill="#D4A017"/>
  <rect x="945" y="500" width="175" height="80" fill="#7A4E8F"/>

  <text x="80" y="601" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#9a9a9a" opacity="0.85">#9A2A2A</text>
  <text x="253" y="601" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#9a9a9a" opacity="0.85">#1B2A4E</text>
  <text x="426" y="601" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#9a9a9a" opacity="0.85">#F3EBDA</text>
  <text x="599" y="601" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#9a9a9a" opacity="0.85">#3A7D7B</text>
  <text x="772" y="601" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#9a9a9a" opacity="0.85">#D4A017</text>
  <text x="945" y="601" font-family="JetBrains Mono, Menlo, monospace" font-size="11" fill="#9a9a9a" opacity="0.85">#7A4E8F</text>

  <text x="1120" y="601" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="0.08em">colorcombinations.org</text>
</svg>
