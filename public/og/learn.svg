<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7EF"/>

  <g transform="translate(80, 64)">
    <rect x="0" y="-14" width="14" height="14" fill="#9A2A2A"/>
    <rect x="16" y="-14" width="14" height="14" fill="#1B2A4E"/>
    <rect x="32" y="-14" width="14" height="14" fill="#F4EEE0" stroke="#d9d6ce" stroke-width="0.5"/>
    <text x="58" y="0" font-family="EB Garamond, Garamond, serif" font-size="18" fill="#141414">The Dictionary of Color Combinations</text>
  </g>

  <text x="80" y="135" font-family="Inter, sans-serif" font-size="14" fill="#9A2A2A" letter-spacing="0.14em">LEARN</text>
  <text x="80" y="220" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">Working guides</text>
  <text x="80" y="305" font-family="EB Garamond, Garamond, serif" font-size="84" font-weight="500" fill="#141414">for designers.</text>
  <text x="80" y="365" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">Long-form articles on color theory, palette use,</text>
  <text x="80" y="400" font-family="EB Garamond, Garamond, serif" font-size="26" font-style="italic" fill="#6b6b6b">and the Japanese tradition behind the dictionary.</text>

  <line x1="80" y1="445" x2="1120" y2="445" stroke="#d9d6ce" stroke-width="1"/>

  <!-- Four article cards horizontally — 248px each, 16px gutter -->
  <g>
    <rect x="80" y="475" width="248" height="120" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="4"/>
    <rect x="96" y="495" width="42" height="80" fill="#9A2A2A"/>
    <text x="150" y="514" font-family="Inter, sans-serif" font-size="9" fill="#9a9a9a" letter-spacing="0.1em">COLOR THEORY</text>
    <text x="150" y="540" font-family="EB Garamond, Garamond, serif" font-size="19" fill="#141414">The Four Reds</text>
    <text x="150" y="562" font-family="EB Garamond, Garamond, serif" font-size="12" fill="#6b6b6b">Kurenai, akane,</text>
    <text x="150" y="580" font-family="EB Garamond, Garamond, serif" font-size="12" fill="#6b6b6b">shu, entan.</text>
  </g>

  <g>
    <rect x="344" y="475" width="248" height="120" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="4"/>
    <rect x="360" y="495" width="42" height="80" fill="#7E6B4E"/>
    <text x="414" y="514" font-family="Inter, sans-serif" font-size="9" fill="#9a9a9a" letter-spacing="0.1em">COLOR THEORY</text>
    <text x="414" y="540" font-family="EB Garamond, Garamond, serif" font-size="19" fill="#141414">Wabi-Sabi</text>
    <text x="414" y="562" font-family="EB Garamond, Garamond, serif" font-size="12" fill="#6b6b6b">Beauty of things</text>
    <text x="414" y="580" font-family="EB Garamond, Garamond, serif" font-size="12" fill="#6b6b6b">that have aged.</text>
  </g>

  <g>
    <rect x="608" y="475" width="248" height="120" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="4"/>
    <rect x="624" y="495" width="42" height="80" fill="#A8B2A6"/>
    <text x="678" y="514" font-family="Inter, sans-serif" font-size="9" fill="#9a9a9a" letter-spacing="0.1em">COLOR THEORY</text>
    <text x="678" y="540" font-family="EB Garamond, Garamond, serif" font-size="19" fill="#141414">Japandi</text>
    <text x="678" y="562" font-family="EB Garamond, Garamond, serif" font-size="12" fill="#6b6b6b">Where restraint</text>
    <text x="678" y="580" font-family="EB Garamond, Garamond, serif" font-size="12" fill="#6b6b6b">meets light.</text>
  </g>

  <g>
    <rect x="872" y="475" width="248" height="120" fill="#fff" stroke="#d9d6ce" stroke-width="1" rx="4"/>
    <rect x="888" y="495" width="42" height="80" fill="#3F5874"/>
    <text x="942" y="514" font-family="Inter, sans-serif" font-size="9" fill="#9a9a9a" letter-spacing="0.1em">COLOR THEORY</text>
    <text x="942" y="540" font-family="EB Garamond, Garamond, serif" font-size="19" fill="#141414">Scandinavian</text>
    <text x="942" y="562" font-family="EB Garamond, Garamond, serif" font-size="12" fill="#6b6b6b">Beyond IKEA-</text>
    <text x="942" y="580" font-family="EB Garamond, Garamond, serif" font-size="12" fill="#6b6b6b">white. Hygge too.</text>
  </g>

  <text x="1120" y="615" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8a8a8a" letter-spacing="0.08em">colorcombinations.org/learn</text>
</svg>
